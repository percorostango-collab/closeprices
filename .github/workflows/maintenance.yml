name: Manutenzione Prezzi Vicini

on:
  schedule:
    # Verifica dei prodotti in coda: ogni ora
    - cron: "0 * * * *"
    # Riscoperta dei cataloghi: ogni giorno alle 3:00 UTC
    - cron: "0 3 * * *"
    # Caricamento dei negozi da OpenStreetMap: il primo giorno del mese alle 4:00 UTC
    - cron: "0 4 1 * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: manutenzione
  cancel-in-progress: false

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      PV_TURSO_URL: ${{ secrets.PV_TURSO_URL }}
      PV_TURSO_TOKEN: ${{ secrets.PV_TURSO_TOKEN }}
      PV_CONTACT: ${{ secrets.PV_CONTACT }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-server.txt

      - name: Diagnosi database (nessun segreto nel risultato)
        run: |
          set -o pipefail
          mkdir -p results/maintenance
          python -m server.cli diag 2>&1 | tee results/maintenance/diag.json

      - name: Verifica dei prodotti in coda
        if: always() && (github.event.schedule == '0 * * * *' || github.event_name == 'workflow_dispatch')
        env:
          PV_INDEX_BUDGET_S: "60"
        run: |
          set -o pipefail
          mkdir -p results/maintenance
          python -m server.cli index --limit 20 2>&1 | tee results/maintenance/index.log

      - name: Riscoperta dei cataloghi
        if: always() && (github.event.schedule == '0 3 * * *' || github.event_name == 'workflow_dispatch')
        run: |
          set -o pipefail
          mkdir -p results/maintenance
          python -m server.cli discover-sites 2>&1 | tee results/maintenance/discover.log

      - name: Caricamento dei negozi da OpenStreetMap
        if: always() && (github.event.schedule == '0 4 1 * *' || github.event_name == 'workflow_dispatch')
        run: |
          set -o pipefail
          mkdir -p results/maintenance
          python -m server.cli load-stores 2>&1 | tee results/maintenance/stores.log

      - name: Stato finale e salvataggio dei log nel repository
        if: always()
        run: |
          mkdir -p results/maintenance
          python -m server.cli coverage 2>&1 | tee results/maintenance/coverage.json || true
          git config user.name "manutenzione-bot"
          git config user.email "manutenzione-bot@users.noreply.github.com"
          git add results/maintenance
          git diff --cached --quiet || git commit -m "Log manutenzione $(date -u +'%Y-%m-%d %H:%M')"
          git pull --rebase || true
          git push
